name: Offline safety tests
on:
  push:
    branches-ignore: [prediction-paper-state]
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  tests:
    strategy:
      fail-fast: false
      matrix:
        python: ['3.10', '3.12', '3.13']
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4.4.0
        with:
          persist-credentials: false
      - uses: actions/setup-python@v6
        with:
          python-version: ${{ matrix.python }}
      - run: python -m unittest discover -s tests -v
      - run: python -m compileall -q app.py finder github_support tests
# No secrets, market calls, state writes, or real trades are used in PR tests.

