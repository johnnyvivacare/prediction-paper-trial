name: Offline safety tests

on:
  push:
    branches-ignore:
      - prediction-paper-state
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  tests:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        python: ['3.10', '3.12', '3.13']
    defaults:
      run:
        shell: bash
        working-directory: CanadaPredictionFinder_GitHub_v3_1
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: ${{ matrix.python }}

      - name: Check uploaded files
        run: |
          set -euo pipefail
          test -f app.py
          test -f github_profile.json
          test -d finder
          test -d github_support
          test -d tests

      - name: Run offline safety tests
        run: python -m unittest discover -s tests -v

      - name: Check Python syntax
        run: python -m compileall -q app.py finder github_support tests
