name: Prediction paper trial
run-name: Paper trial - ${{ inputs.operation || 'scan' }}

on:
  schedule:
    - cron: '2-59/5 * * * *'
  workflow_dispatch:
    inputs:
      operation:
        description: 'Initialize once, then scan. Pause/resume changes paper entries only.'
        type: choice
        options: [scan, initialize, pause, resume]
        default: scan
        required: true

permissions:
  contents: read

concurrency:
  group: prediction-paper-state-writer
  cancel-in-progress: false

jobs:
  paper:
    if: >-
      github.ref_name == github.event.repository.default_branch &&
      !github.event.repository.fork &&
      (github.event_name == 'workflow_dispatch' || vars.ENABLE_PAPER_SCANS == 'true')
    runs-on: ubuntu-24.04
    timeout-minutes: 12
    defaults:
      run:
        shell: bash
    permissions:
      contents: write
      actions: write
    outputs:
      report_ready: ${{ steps.run.outputs.report_ready }}
    steps:
      - name: Check out trusted default-branch code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.12'

      - name: Prepare uploaded bot files on the GitHub runner
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path
          import shutil

          root = Path.cwd()
          nested = root / "CanadaPredictionFinder_GitHub_v3_1"
          files = ("app.py", "github_profile.json")
          dirs = ("finder", "github_support", "tests")
          names = files + dirs

          def complete(folder):
              return (all((folder / name).is_file() for name in files)
                      and all((folder / name).is_dir() for name in dirs))

          if complete(root):
              print("Bot files already at the runner root; no copy needed.")
          elif complete(nested):
              if any((root / name).exists() or (root / name).is_symlink() for name in names):
                  raise SystemExit("Mixed upload layout: bot files exist at both levels. Stop and review; nothing was overwritten.")
              for name in files:
                  shutil.copy2(nested / name, root / name)
              for name in dirs:
                  shutil.copytree(nested / name, root / name)
              print("Bot loaded from CanadaPredictionFinder_GitHub_v3_1 on this GitHub runner.")
          else:
              raise SystemExit("Bot files are incomplete. Expected app.py, github_profile.json, finder, github_support and tests at the top level or inside CanadaPredictionFinder_GitHub_v3_1.")

          if not complete(root):
              raise SystemExit("Runner preparation did not complete; stopping before the bot runs.")
          PY

      - name: Check checkpoint tools
        run: |
          set -euo pipefail
          command -v gpg
          command -v gh
          python -m compileall -q github_support finder

      - name: Restore, run paper test, audit and save encrypted checkpoint
        id: run
        env:
          STATE_PASSPHRASE: ${{ secrets.STATE_PASSPHRASE }}
          REPOSITORY_PRIVATE: ${{ github.event.repository.private }}
          ACK_PRIVATE_ACTIONS_COSTS: ${{ vars.ACK_PRIVATE_ACTIONS_COSTS }}
          PUBLISH_PAPER_SUMMARY: ${{ vars.PUBLISH_PAPER_SUMMARY }}
          OPERATION: ${{ inputs.operation || 'scan' }}
        run: |
          set -euo pipefail
          umask 077
          args=(--operation "$OPERATION" --output "$RUNNER_TEMP/prediction-output")
          if [[ "$GITHUB_EVENT_NAME" == 'workflow_dispatch' && "$OPERATION" == 'initialize' ]]; then
            args+=(--confirm-initialize)
          fi
          python -m github_support.runner "${args[@]}"

      - name: Disable scheduled runs on expiry or unsafe state failure
        if: >-
          always() && (steps.run.outputs.trial_expired == 'true' ||
          steps.run.outputs.halt_workflow == 'true')
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh workflow disable paper-scan.yml

      - name: Keep encrypted recovery checkpoint
        if: always() && (failure() || steps.run.outputs.backup_checkpoint == 'true')
        uses: actions/upload-artifact@v4
        with:
          name: encrypted-paper-state-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/prediction-output/state.gpg
          if-no-files-found: ignore
          retention-days: 7

      - name: Prepare optional public report
        if: >-
          always() && steps.run.outputs.report_ready == 'true' &&
          vars.PUBLISH_PAPER_SUMMARY == 'true'
        uses: actions/upload-pages-artifact@v4
        with:
          path: ${{ runner.temp }}/prediction-output/site
          retention-days: 1

  publish:
    needs: paper
    if: >-
      always() && needs.paper.outputs.report_ready == 'true' &&
      vars.PUBLISH_PAPER_SUMMARY == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Publish aggregate paper-test report
        id: deployment
        uses: actions/deploy-pages@v4
