name: Check saved secret

on:
  workflow_dispatch:

permissions: {}

jobs:
  check:
    runs-on: ubuntu-24.04
    timeout-minutes: 2
    steps:
      - name: Check format without showing the password
        shell: bash
        env:
          STATE_PASSPHRASE: ${{ secrets.STATE_PASSPHRASE }}
        run: |
          python3 - <<'PY'
          import os

          secret = os.environ.get("STATE_PASSPHRASE", "")
          checks = [
              ("Secret reached this workflow", bool(secret)),
              ("At least 32 characters", len(secret) >= 32),
              ("No more than 1024 characters", len(secret) <= 1024),
              ("No line breaks or null characters", not any(c in secret for c in "\r\n\0")),
          ]
          report = "## Saved secret check\n\n"
          for label, passed in checks:
              report += f"{'PASS' if passed else 'FAIL'}: {label}\n\n"
          print(report)
          with open(os.environ["GITHUB_STEP_SUMMARY"], "a", encoding="utf-8") as summary:
              summary.write(report)
          raise SystemExit(0 if all(passed for _, passed in checks) else 1)
          PY
